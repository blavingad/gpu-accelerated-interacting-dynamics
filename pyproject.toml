[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-accelerated-interacting-dynamics"
version = "0.1.0"
description = "GPU-accelerated multiphysics simulation and inverse design of interacting dynamical systems"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Matteo Trapasso"}]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "jax", "jaxlib"]

[project.urls]
Repository = "https://github.com/blavingad/gpu-accelerated-interacting-dynamics"

[tool.setuptools.packages.find]
where = ["src"]
